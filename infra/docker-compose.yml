version: '3.9'
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: flow_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/flow_monitor
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: devsecret
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: ../backend
    command: celery -A app.tasks.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/flow_monitor
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: devsecret
    depends_on: [api, redis]

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
